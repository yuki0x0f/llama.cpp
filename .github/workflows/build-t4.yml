name: Build llama-server for NVIDIA T4

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "llama.cpp Git tag"
        required: true
        default: "b12653"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build build-essential \
            libcurl4-openssl-dev zip patchelf

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Build llama-server
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=ON

          cmake --build build --target llama-server -j2

      - name: Package server and dependencies
        run: |
          mkdir -p package/bin package/lib

          cp build/bin/llama-server package/bin/

          ldd build/bin/llama-server > dependencies.txt
          cat dependencies.txt

          while read -r lib; do
            if [ -f "$lib" ]; then
              cp -L "$lib" package/lib/
            fi
          done < <(
            ldd build/bin/llama-server |
            awk '/=> \// {print $3} /^\// {print $1}'
          )

          cp -r /usr/local/cuda/lib64 package/cuda-lib64

          cat > package/README.txt <<'EOF'
          llama-server NVIDIA T4 build
          Architecture: Linux x86_64
          CUDA architecture: sm_75
          CUDA Toolkit: 12.9.2

          Run:
          LD_LIBRARY_PATH="$PWD/lib:$PWD/cuda-lib64:$LD_LIBRARY_PATH" \
            ./bin/llama-server --list-devices

          Note:
          NVIDIA driver must be installed on the target machine.
          EOF

          zip -r llama-server-linux-x64-t4.zip package

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x64-t4
          path: llama-server-linux-x64-t4.zip
          retention-days: 14
